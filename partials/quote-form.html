      <form class="form rev-up" id="quote-form">
        <div class="f-field">
          <label for="q-trade">Your trade *</label>
          <select id="q-trade" name="trade" required>
            <option value="">Select…</option>
            <option>Flooring / Div 09</option>
            <option>Drywall &amp; steel stud</option>
            <option>Acoustic ceilings (ACT)</option>
            <option>Painting</option>
            <option>Glazing / Div 08</option>
            <option>Roofing &amp; building envelope</option>
            <option>Misc metals / Div 05</option>
            <option>Concrete / formwork</option>
            <option>Framing / wood-frame</option>
            <option>Bid leveling / scope-gap analysis</option>
            <option>Other specialty trade</option>
            <option>GC / developer</option>
          </select>
        </div>
        <div class="f-field"><label for="q-drawings">Drawings link (Dropbox / Drive / plan room)</label><input id="q-drawings" name="drawings_link" type="text" inputmode="url" autocomplete="off" placeholder="Paste a Dropbox, Drive or plan room link" /></div>
        <div class="f-field"><label for="q-email">Email *</label><input id="q-email" name="email" type="email" required autocomplete="email" /></div>

        <button type="button" class="more-toggle" id="moreToggle" aria-expanded="false" aria-controls="more-fields">＋ Add details (name, phone, deadline)</button>
        <div class="more-fields" id="more-fields" hidden>
          <div class="f-row">
            <div class="f-field"><label for="q-name">Name</label><input id="q-name" name="name" autocomplete="name" /></div>
            <div class="f-field"><label for="q-company">Company</label><input id="q-company" name="company" autocomplete="organization" /></div>
          </div>
          <div class="f-row">
            <div class="f-field"><label for="q-phone">Phone</label><input id="q-phone" name="phone" type="tel" autocomplete="tel" /></div>
            <div class="f-field"><label for="q-deadline">Bid deadline</label><input id="q-deadline" name="deadline" placeholder="e.g. Thu Aug 13, 2 PM" /></div>
          </div>
          <div class="f-field"><label for="q-details">Scope notes</label><textarea id="q-details" name="details" placeholder="e.g. Level 2–4 flooring package, addendum 2 issued, need it by Tuesday"></textarea></div>
        </div>

        <button class="btn btn-ink btn-block" type="submit">Get my fixed quote</button>
        <p class="fine">Confidential. No spam. Response within 4 business hours.</p>
      </form>
      <div class="form-ok">
        <span class="bigtick">✓</span>
        <h3>Received.</h3>
        <p style="color:var(--ink-soft);margin-top:8px;">Your fixed quote is on its way — within 4 business hours.<br />More drawings or addenda? Email <a href="mailto:info@sharpbid.ca">info@sharpbid.ca</a>.</p>
      </div>
